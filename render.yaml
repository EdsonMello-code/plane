services:
  # ----------------------------------------------------
  # 1. Banco de Dados PostgreSQL
  # ----------------------------------------------------
  - type: pserv
    name: penpot-postgres
    env: docker
    repo: https://github.com/postgres/postgres # Render exige um repo ou imagem Docker
    image:
      url: postgres:15
    plan: starter
    disk:
      name: pgdata
      mountPath: /var/lib/postgresql/data
      sizeGB: 10
    envVars:
      - key: POSTGRES_DB
        value: penpot
      - key: POSTGRES_USER
        value: penpot
      - key: POSTGRES_PASSWORD
        value: penpot
      - key: POSTGRES_INITDB_ARGS
        value: --data-checksums

  # ----------------------------------------------------
  # 2. Valkey (Redis)
  # ----------------------------------------------------
  - type: pserv
    name: penpot-valkey
    env: docker
    image:
      url: valkey/valkey:8.1
    plan: starter
    envVars:
      - key: VALKEY_EXTRA_FLAGS
        value: --maxmemory 128mb --maxmemory-policy volatile-lfu

  # ----------------------------------------------------
  # 3. Penpot Backend
  # ----------------------------------------------------
  - type: worker
    name: penpot-backend
    env: docker
    image:
      url: penpotapp/backend:2.16
    plan: starter
    envVars:
      - key: PENPOT_FLAGS
        value: disable-email-verification enable-smtp enable-prepl-server disable-secure-session-cookies enable-mcp
      - key: PENPOT_PUBLIC_URI
        fromService:
          type: web
          name: penpot-frontend
          property: url
      - key: PENPOT_HTTP_SERVER_MAX_BODY_SIZE
        value: "367001600"
      - key: PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE
        value: "367001600"
      - key: PENPOT_SECRET_KEY
        generateValue: true
      - key: PENPOT_DATABASE_URI
        value: postgresql://penpot@penpot-postgres:5432/penpot
      - key: PENPOT_DATABASE_USERNAME
        value: penpot
      - key: PENPOT_DATABASE_PASSWORD
        value: penpot
      - key: PENPOT_REDIS_URI
        value: redis://penpot-valkey:6379/0
      - key: PENPOT_OBJECTS_STORAGE_BACKEND
        value: fs
      - key: PENPOT_OBJECTS_STORAGE_FS_DIRECTORY
        value: /opt/data/assets
      - key: PENPOT_TELEMETRY_ENABLED
        value: "true"
      - key: PENPOT_TELEMETRY_REFERER
        value: render-blueprint

  # ----------------------------------------------------
  # 4. Penpot Frontend (Serviço Web Público)
  # ----------------------------------------------------
  - type: web
    name: penpot-frontend
    env: docker
    image:
      url: penpotapp/frontend:2.16
    plan: starter
    disk:
      name: penpot-assets
      mountPath: /opt/data/assets
      sizeGB: 10
    envVars:
      - key: PENPOT_FLAGS
        value: disable-email-verification enable-smtp enable-prepl-server disable-secure-session-cookies enable-mcp
      - key: PENPOT_HTTP_SERVER_MAX_BODY_SIZE
        value: "367001600"
      - key: PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE
        value: "367001600"

  # ----------------------------------------------------
  # 5. Penpot Exporter
  # ----------------------------------------------------
  - type: worker
    name: penpot-exporter
    env: docker
    image:
      url: penpotapp/exporter:2.16
    plan: starter
    envVars:
      - key: PENPOT_REDIS_URI
        value: redis://penpot-valkey:6379/0
      - key: PENPOT_INTERNAL_URI
        fromService:
          type: web
          name: penpot-frontend
          property: url

  # ----------------------------------------------------
  # 6. Penpot MCP
  # ----------------------------------------------------
  - type: worker
    name: penpot-mcp
    env: docker
    image:
      url: penpotapp/mcp:2.16
    plan: starter