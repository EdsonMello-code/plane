services:
  # ============================================================
  # PENPOT FRONTEND
  # ============================================================
  - type: web
    name: penpot-frontend
    runtime: image
    image:
      url: docker.io/penpotapp/frontend:2.16
    plan: starter

    envVars:
      - key: PENPOT_FLAGS
        value: disable-email-verification enable-smtp enable-prepl-server disable-secure-session-cookies enable-mcp

      - key: PENPOT_HTTP_SERVER_MAX_BODY_SIZE
        value: "367001600"

      - key: PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE
        value: "367001600"

      - key: PENPOT_PUBLIC_URI
        fromService:
          type: web
          name: penpot-frontend
          property: host

    disk:
      name: penpot-assets
      mountPath: /opt/data/assets
      sizeGB: 10

    healthCheckPath: /

  # ============================================================
  # PENPOT BACKEND
  # ============================================================
  - type: web
    name: penpot-backend
    runtime: image
    image:
      url: docker.io/penpotapp/backend:2.16
    plan: starter

    envVars:
      - key: PENPOT_FLAGS
        value: disable-email-verification enable-smtp enable-prepl-server disable-secure-session-cookies enable-mcp

      - key: PENPOT_HTTP_SERVER_MAX_BODY_SIZE
        value: "367001600"

      - key: PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE
        value: "367001600"

      - key: PENPOT_PUBLIC_URI
        fromService:
          type: web
          name: penpot-frontend
          property: host

      - key: PENPOT_SECRET_KEY
        generateValue: true

      - key: PENPOT_DATABASE_URI
        fromDatabase:
          name: penpot-db
          property: connectionString

      - key: PENPOT_DATABASE_USERNAME
        fromDatabase:
          name: penpot-db
          property: user

      - key: PENPOT_DATABASE_PASSWORD
        fromDatabase:
          name: penpot-db
          property: password

      - key: PENPOT_REDIS_URI
        value: redis://penpot-valkey:6379/0

      - key: PENPOT_OBJECTS_STORAGE_BACKEND
        value: fs

      - key: PENPOT_OBJECTS_STORAGE_FS_DIRECTORY
        value: /opt/data/assets

      - key: PENPOT_TELEMETRY_ENABLED
        value: "true"

      - key: PENPOT_TELEMETRY_REFERER
        value: render

      - key: PENPOT_SMTP_DEFAULT_FROM
        value: no-reply@example.com

      - key: PENPOT_SMTP_DEFAULT_REPLY_TO
        value: no-reply@example.com

      - key: PENPOT_SMTP_HOST
        value: penpot-mailcatch

      - key: PENPOT_SMTP_PORT
        value: "1025"

      - key: PENPOT_SMTP_TLS
        value: "false"

      - key: PENPOT_SMTP_SSL
        value: "false"

    disk:
      name: penpot-assets
      mountPath: /opt/data/assets
      sizeGB: 10

  # ============================================================
  # PENPOT MCP
  # ============================================================
  - type: web
    name: penpot-mcp
    runtime: image
    image:
      url: docker.io/penpotapp/mcp:2.16
    plan: starter

  # ============================================================
  # PENPOT EXPORTER
  # ============================================================
  - type: worker
    name: penpot-exporter
    runtime: image
    image:
      url: docker.io/penpotapp/exporter:2.16
    plan: starter

    envVars:
      - key: PENPOT_SECRET_KEY
        fromService:
          type: web
          name: penpot-backend
          envVarKey: PENPOT_SECRET_KEY

      - key: PENPOT_PUBLIC_URI
        fromService:
          type: web
          name: penpot-frontend
          property: host

      - key: PENPOT_INTERNAL_URI
        value: http://penpot-frontend:8080

      - key: PENPOT_REDIS_URI
        value: redis://penpot-valkey:6379/0

  # ============================================================
  # VALKEY
  # ============================================================
  - type: pserv
    name: penpot-valkey
    runtime: image
    image:
      url: docker.io/valkey/valkey:8.1
    plan: starter

    envVars:
      - key: VALKEY_EXTRA_FLAGS
        value: --maxmemory 128mb --maxmemory-policy volatile-lfu

# ==============================================================
# POSTGRESQL
# ==============================================================
databases:
  - name: penpot-db
    databaseName: penpot
    user: penpot
    plan: basic-256mb