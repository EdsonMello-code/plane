services:
  # ============================================================
  # PENPOT FRONTEND
  # ============================================================
  - type: web
    name: penpot-frontend
    runtime: image
    image:
      url: docker.io/penpotapp/frontend:2.16
    plan: starter

    envVars:
      - key: PENPOT_FLAGS
        value: enable-smtp enable-prepl-server enable-mcp

      - key: PENPOT_HTTP_SERVER_MAX_BODY_SIZE
        value: "367001600"

      - key: PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE
        value: "367001600"

      - key: PENPOT_PUBLIC_URI
        fromService:
          type: web
          name: penpot-frontend
          envVarKey: RENDER_EXTERNAL_URL

    healthCheckPath: /

  # ============================================================
  # PENPOT BACKEND
  # ============================================================
  - type: web
    name: penpot-backend
    runtime: image
    image:
      url: docker.io/penpotapp/backend:2.16
    plan: starter

    envVars:
      - key: PENPOT_FLAGS
        value: enable-smtp enable-prepl-server enable-mcp

      - key: PENPOT_PUBLIC_URI
        fromService:
          type: web
          name: penpot-frontend
          envVarKey: RENDER_EXTERNAL_URL

      - key: PENPOT_HTTP_SERVER_MAX_BODY_SIZE
        value: "367001600"

      - key: PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE
        value: "367001600"

      - key: PENPOT_SECRET_KEY
        generateValue: true

      # PostgreSQL
      - key: PENPOT_DATABASE_URI
        fromDatabase:
          name: penpot-db
          property: connectionString

      - key: PENPOT_DATABASE_USERNAME
        fromDatabase:
          name: penpot-db
          property: user

      - key: PENPOT_DATABASE_PASSWORD
        fromDatabase:
          name: penpot-db
          property: password

      # Valkey
      - key: PENPOT_REDIS_URI
        fromService:
          type: keyvalue
          name: penpot-valkey
          property: connectionString

      # Object storage
      - key: PENPOT_OBJECTS_STORAGE_BACKEND
        value: s3

      - key: PENPOT_OBJECTS_STORAGE_S3_ENDPOINT
        sync: false

      - key: PENPOT_OBJECTS_STORAGE_S3_BUCKET
        sync: false

      - key: AWS_ACCESS_KEY_ID
        sync: false

      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      # Telemetry
      - key: PENPOT_TELEMETRY_ENABLED
        value: "true"

      - key: PENPOT_TELEMETRY_REFERER
        value: render

      # SMTP
      - key: PENPOT_SMTP_DEFAULT_FROM
        sync: false

      - key: PENPOT_SMTP_DEFAULT_REPLY_TO
        sync: false

      - key: PENPOT_SMTP_HOST
        sync: false

      - key: PENPOT_SMTP_PORT
        sync: false

      - key: PENPOT_SMTP_USERNAME
        sync: false

      - key: PENPOT_SMTP_PASSWORD
        sync: false

      - key: PENPOT_SMTP_TLS
        value: "true"

      - key: PENPOT_SMTP_SSL
        value: "false"

    healthCheckPath: /

  # ============================================================
  # PENPOT EXPORTER
  # ============================================================
  - type: private
    name: penpot-exporter
    runtime: image
    image:
      url: docker.io/penpotapp/exporter:2.16
    plan: starter

    envVars:
      - key: PENPOT_SECRET_KEY
        fromService:
          type: web
          name: penpot-backend
          envVarKey: PENPOT_SECRET_KEY

      - key: PENPOT_PUBLIC_URI
        fromService:
          type: web
          name: penpot-frontend
          envVarKey: RENDER_EXTERNAL_URL

      - key: PENPOT_INTERNAL_URI
        fromService:
          type: web
          name: penpot-frontend
          property: hostport

      - key: PENPOT_REDIS_URI
        fromService:
          type: keyvalue
          name: penpot-valkey
          property: connectionString

  # ============================================================
  # PENPOT MCP
  # ============================================================
  - type: web
    name: penpot-mcp
    runtime: image
    image:
      url: docker.io/penpotapp/mcp:2.16
    plan: starter

    envVars:
      - key: PENPOT_PUBLIC_URI
        fromService:
          type: web
          name: penpot-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # ============================================================
  # VALKEY
  # ============================================================
  - type: keyvalue
    name: penpot-valkey
    plan: starter

databases:
  # ============================================================
  # POSTGRESQL
  # ============================================================
  - name: penpot-db
    plan: basic-256mb
    databaseName: penpot
    user: penpot