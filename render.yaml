# render.yaml
#
# Penpot on Render
#
# Arquitetura:
#
#   Internet
#      |
#      v
#   penpot-frontend       (WEB)
#      |
#      +----> penpot-backend       (PRIVATE)
#      |
#      +----> penpot-exporter     (PRIVATE)
#      |
#      +----> penpot-mcp           (WEB)
#
#   penpot-backend
#      |
#      +----> penpot-db            (PostgreSQL)
#      |
#      +----> penpot-valkey        (Key Value / Redis)
#
#   Assets:
#      S3 / Cloudflare R2 / outro storage compatível com S3
#
# IMPORTANTE:
# - Não coloque secrets reais neste arquivo.
# - Valores `sync: false` serão preenchidos no Dashboard do Render.
# - MCP requer instância única do Penpot segundo a documentação atual.

services:

  # ============================================================
  # PENPOT FRONTEND
  # ============================================================
  - type: web
    name: penpot-frontend
    runtime: image
    image:
      url: docker.io/penpotapp/frontend:2.16

    plan: starter

    envVars:

      # --------------------------------------------------------
      # Penpot
      # --------------------------------------------------------
      - key: PENPOT_PUBLIC_URI
        fromService:
          type: web
          name: penpot-frontend
          envVarKey: RENDER_EXTERNAL_URL

      - key: PENPOT_FLAGS
        value: "enable-smtp enable-prepl-server enable-mcp"

      # --------------------------------------------------------
      # Backend
      #
      # Penpot frontend usa o backend internamente.
      # Backend escuta na porta 6060.
      # --------------------------------------------------------
      - key: PENPOT_BACKEND_URI
        value: "http://penpot-backend:6060"

      # --------------------------------------------------------
      # Exporter
      #
      # Exporter escuta na porta 6061.
      # --------------------------------------------------------
      - key: PENPOT_EXPORTER_URI
        value: "http://penpot-exporter:6061"

      # --------------------------------------------------------
      # Upload/body limit
      # --------------------------------------------------------
      - key: PENPOT_HTTP_SERVER_MAX_BODY_SIZE
        value: "367001600"

      - key: PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE
        value: "367001600"

    healthCheckPath: /

  # ============================================================
  # PENPOT BACKEND
  # ============================================================
  - type: pserv
    name: penpot-backend
    runtime: image
    image:
      url: docker.io/penpotapp/backend:2.16

    plan: starter

    envVars:

      # --------------------------------------------------------
      # Penpot
      # --------------------------------------------------------
      - key: PENPOT_PUBLIC_URI
        fromService:
          type: web
          name: penpot-frontend
          envVarKey: RENDER_EXTERNAL_URL

      - key: PENPOT_FLAGS
        value: "enable-smtp enable-prepl-server enable-mcp"

      # --------------------------------------------------------
      # SECRET KEY
      #
      # Render gera automaticamente.
      # --------------------------------------------------------
      - key: PENPOT_SECRET_KEY
        generateValue: true

      # --------------------------------------------------------
      # PostgreSQL
      # --------------------------------------------------------
      - key: PENPOT_DATABASE_URI
        fromDatabase:
          name: penpot-db
          property: connectionString

      - key: PENPOT_DATABASE_USERNAME
        fromDatabase:
          name: penpot-db
          property: user

      - key: PENPOT_DATABASE_PASSWORD
        fromDatabase:
          name: penpot-db
          property: password

      # --------------------------------------------------------
      # Valkey / Redis
      # --------------------------------------------------------
      - key: PENPOT_REDIS_URI
        fromService:
          type: keyvalue
          name: penpot-valkey
          property: connectionString

      # --------------------------------------------------------
      # Object Storage
      #
      # Use S3 / Cloudflare R2 / outro storage S3-compatible.
      # --------------------------------------------------------
      - key: PENPOT_OBJECTS_STORAGE_BACKEND
        value: "s3"

      - key: PENPOT_OBJECTS_STORAGE_S3_BUCKET
        sync: false

      - key: PENPOT_OBJECTS_STORAGE_S3_REGION
        sync: false

      - key: PENPOT_OBJECTS_STORAGE_S3_ENDPOINT
        sync: false

      - key: AWS_ACCESS_KEY_ID
        sync: false

      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      # --------------------------------------------------------
      # File data
      # --------------------------------------------------------
      # Mantemos o default do Penpot.
      # Pode ser alterado posteriormente caso necessário.
      #
      # PENPOT_FILE_DATA_BACKEND: db

      # --------------------------------------------------------
      # Telemetry
      # --------------------------------------------------------
      - key: PENPOT_TELEMETRY_ENABLED
        value: "true"

      - key: PENPOT_TELEMETRY_REFERER
        value: "render"

      # --------------------------------------------------------
      # SMTP
      #
      # Configure no Render Dashboard.
      # Exemplos:
      # Resend
      # SendGrid
      # Mailgun
      # Amazon SES
      # etc.
      # --------------------------------------------------------
      - key: PENPOT_SMTP_DEFAULT_FROM
        sync: false

      - key: PENPOT_SMTP_DEFAULT_REPLY_TO
        sync: false

      - key: PENPOT_SMTP_HOST
        sync: false

      - key: PENPOT_SMTP_PORT
        sync: false

      - key: PENPOT_SMTP_USERNAME
        sync: false

      - key: PENPOT_SMTP_PASSWORD
        sync: false

      - key: PENPOT_SMTP_TLS
        value: "true"

      - key: PENPOT_SMTP_SSL
        value: "false"

      # --------------------------------------------------------
      # Upload/body limit
      # --------------------------------------------------------
      - key: PENPOT_HTTP_SERVER_MAX_BODY_SIZE
        value: "367001600"

      - key: PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE
        value: "367001600"

  # ============================================================
  # PENPOT EXPORTER
  # ============================================================
  - type: pserv
    name: penpot-exporter
    runtime: image
    image:
      url: docker.io/penpotapp/exporter:2.16

    plan: starter

    envVars:

      # --------------------------------------------------------
      # Penpot public URI
      # --------------------------------------------------------
      - key: PENPOT_PUBLIC_URI
        fromService:
          type: web
          name: penpot-frontend
          envVarKey: RENDER_EXTERNAL_URL

      # --------------------------------------------------------
      # Secret key
      #
      # Deve ser exatamente o mesmo usado pelo backend.
      # --------------------------------------------------------
      - key: PENPOT_SECRET_KEY
        fromService:
          type: pserv
          name: penpot-backend
          envVarKey: PENPOT_SECRET_KEY

      # --------------------------------------------------------
      # Frontend interno
      #
      # O exporter usa Chromium/headless browser para acessar
      # o frontend.
      # --------------------------------------------------------
      - key: PENPOT_INTERNAL_URI
        value: "http://penpot-frontend:8080"

      # --------------------------------------------------------
      # Valkey
      # --------------------------------------------------------
      - key: PENPOT_REDIS_URI
        fromService:
          type: keyvalue
          name: penpot-valkey
          property: connectionString

  # ============================================================
  # PENPOT MCP
  # ============================================================
  #
  # Exposto publicamente através do Render.
  #
  # O Penpot 2.15+ possui MCP.
  # Como o MCP exige instância única do Penpot, não escale o
  # frontend/backend horizontalmente enquanto ele estiver ativo.
  #
  - type: web
    name: penpot-mcp
    runtime: image
    image:
      url: docker.io/penpotapp/mcp:2.16

    plan: starter

    envVars:

      - key: PENPOT_PUBLIC_URI
        fromService:
          type: web
          name: penpot-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # ============================================================
  # VALKEY
  # ============================================================
  - type: keyvalue
    name: penpot-valkey

    plan: starter

    # O Render exige ipAllowList para Key Value.
    #
    # Lista vazia bloqueia acesso público.
    # Os serviços Render continuam usando a rede privada.
    ipAllowList: []

    maxmemoryPolicy: volatile-lfu


# ==============================================================
# POSTGRESQL
# ==============================================================
databases:

  - name: penpot-db

    plan: basic-256mb

    databaseName: penpot

    user: penpot

    postgresMajorVersion: "15"

    # Apenas serviços Render precisam acessar.
    # Para começar, deixamos sem restrição explícita.
    #
    # Depois você pode restringir via IP.